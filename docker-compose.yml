# Единая точка входа: PostgreSQL + приложение (бэкенд и интерфейс в одном jar).
#   docker compose up --build        запустить всё
#   docker compose up -d db          только база (для запуска приложения из IDE или через start.sh)
#   docker compose down              остановить; добавьте -v, чтобы удалить данные
# Переменные берутся из файла .env (см. .env.example), без него действуют значения по умолчанию.
services:
  db:
    image: postgres:16
    container_name: matchly-db
    environment:
      POSTGRES_DB: ${MATCHLY_DB_NAME:-matchly_db}
      POSTGRES_USER: ${MATCHLY_DB_USER:-matchly}
      POSTGRES_PASSWORD: ${MATCHLY_DB_PASSWORD:-matchly}
    ports:
      - "${MATCHLY_DB_PORT:-5432}:5432"
    volumes:
      - matchly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATCHLY_DB_USER:-matchly} -d ${MATCHLY_DB_NAME:-matchly_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    image: matchly:local
    container_name: matchly-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      MATCHLY_DB_URL: jdbc:postgresql://db:5432/${MATCHLY_DB_NAME:-matchly_db}
      MATCHLY_DB_USER: ${MATCHLY_DB_USER:-matchly}
      MATCHLY_DB_PASSWORD: ${MATCHLY_DB_PASSWORD:-matchly}
      MATCHLY_JWT_SECRET: ${MATCHLY_JWT_SECRET:-matchly-dev-secret-key-change-me-please-0123456789}
      MATCHLY_JWT_TTL: ${MATCHLY_JWT_TTL:-12h}
      MATCHLY_ADMIN_EMAIL: ${MATCHLY_ADMIN_EMAIL:-admin@matchly.local}
      MATCHLY_ADMIN_PASSWORD: ${MATCHLY_ADMIN_PASSWORD:-admin123}
      MATCHLY_SEED: ${MATCHLY_SEED:-true}
    ports:
      - "${MATCHLY_PORT:-8080}:8080"
    volumes:
      - matchly-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    restart: unless-stopped

volumes:
  matchly-pgdata:
  matchly-logs:
