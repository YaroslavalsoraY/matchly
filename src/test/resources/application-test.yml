# Тестовый профиль: встроенная H2 в режиме совместимости с PostgreSQL.
# Тесты не требуют установленного PostgreSQL и Docker, поэтому одинаково идут на Windows и Linux.
spring:
  datasource:
    url: jdbc:h2:mem:matchly;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

matchly:
  seed:
    enabled: false
